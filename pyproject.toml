[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complexityrouter"
version = "0.1.0"
description = "ComplexityRouter - Route inputs to experts by scale-invariant complexity"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
